name: Build VRSky Quest APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
      - name: Configure Godot Android editor settings
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -v \
            -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
            -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" \
            -keypass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=sn-Cloud,C=US"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Validate Rust
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
          cargo check --workspace --release
      - name: Validate Mobile renderer baseline
        run: |
          grep -F 'config/features=PackedStringArray(' project.godot | grep -F '"Mobile"'
          grep -Fx 'renderer/rendering_method="mobile"' project.godot
          if grep -Fq 'gl_compatibility' project.godot README.md docs/ANDROID.md; then
            echo "Compatibility renderer reference found in the Mobile renderer baseline" >&2
            exit 1
          fi
      - name: Build host and Android GDExtension libraries
        run: |
          mkdir -p addons/vrsky/bin/linux addons/vrsky/bin/android
          cargo build --release -p vrsky_native
          cp target/release/libvrsky_native.so addons/vrsky/bin/linux/libvrsky_native.so
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -o addons/vrsky/bin/android build --release -p vrsky_native
          test -f addons/vrsky/bin/android/arm64-v8a/libvrsky_native.so
      - name: Export VRSky Quest debug APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          relative_project_path: ./
          export_debug: true
          presets_to_export: VRSky Quest 3 Debug
          use_preset_export_path: true
          verbose: true
      - name: Locate APK
        id: apk
        run: |
          APK_PATH="$(find build -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"
      - name: Verify APK
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path(os.environ["APK_PATH"])
          target = "lib/arm64-v8a/libvrsky_native.so"
          with ZipFile(apk) as archive:
              matches = [name for name in archive.namelist() if name == target]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one {target}, found {len(matches)}")
          print(f"Verified {target} in {apk}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vrsky-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

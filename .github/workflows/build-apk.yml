name: Build Quest APK

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "ndk;28.1.13356709"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Validate Rust
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
      - name: Build host and Android GDExtension libraries
        run: |
          mkdir -p godot/bin
          cargo build --release -p quest_sky_native
          cp target/release/libquest_sky_native.so godot/bin/libquest_sky_native.linux.release.x86_64.so
          cp target/release/libquest_sky_native.so godot/bin/libquest_sky_native.linux.debug.x86_64.so
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -o godot/bin build --release -p quest_sky_native
          NATIVE_LIB="$(find godot/bin -name libquest_sky_native.so | head -n 1)"
          test -n "$NATIVE_LIB"
          cp "$NATIVE_LIB" godot/bin/libquest_sky_native.android.release.arm64.so
          cp "$NATIVE_LIB" godot/bin/libquest_sky_native.android.debug.arm64.so
          cp godot/quest_sky.gdextension.template godot/quest_sky.gdextension
      - name: Export Quest debug APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          relative_project_path: ./
          export_debug: true
          presets_to_export: Quest 3 Debug
          use_preset_export_path: true
          verbose: true
      - name: Verify APK
        run: |
          test -f build/quest-sky-debug.apk
          unzip -l build/quest-sky-debug.apk | grep -q "lib/arm64-v8a/libquest_sky_native"
          ls -lh build/quest-sky-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: quest-sky-debug-apk
          path: build/quest-sky-debug.apk
          if-no-files-found: error
          retention-days: 14
